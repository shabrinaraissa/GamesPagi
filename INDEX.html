/* Baris di beranda. cat: acara / tugas / logistik / kabar. style: top10 / poster / wide */
var ROWS = [
 { title:"Top 10 yang Wajib Kamu Tahu", cat:"acara", style:"top10", ids:["tema","dress","agenda","gub","race"] },
 { title:"Lanjutkan Menonton", cat:"tugas", style:"wide", ids:["survey","upload"] },
 { title:"Panggung dan Lomba", cat:"acara", style:"poster", ids:["gub","race","agenda"] },
 { title:"Perjalanan dan Menginap", cat:"logistik", style:"poster", ids:["bus","stay"] },
 { title:"Baru Dirilis", cat:"kabar", style:"poster", ids:["news","tema"] }
];
var PILLS = [["all","Semua"],["acara","Acara"],["tugas","Tugas"],["logistik","Logistik"],["kabar","Pengumuman"]];
/* ============ SELESAI ============ */

(function(){
  var $=function(i){return document.getElementById(i)};
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  var BY={};ITEMS.forEach(function(i){BY[i.id]=i});
  $('avatar').textContent=EVENT.avatar;

  /* progres tugas, hanya di browser ini */
  var done={};
  try{done=JSON.parse(localStorage.getItem('infoflix-done')||'{}')}catch(e){}
  function saveDone(){try{localStorage.setItem('infoflix-done',JSON.stringify(done))}catch(e){}}

  var toastT;
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}

  function firstLink(it){
    for(var i=0;i<it.blocks.length;i++){var b=it.blocks[i];if(b.t==='links'){return b.items[0]}}return null}

  function poster(it,extraCls){
    var p=el('div','poster '+(extraCls||''));p.style.setProperty('--h',it.h);
    p.appendChild(el('span','i','I'));p.appendChild(el('span','em',it.em));p.appendChild(el('span','nm',it.title));
    if(it.badge)p.appendChild(el('span','new',it.badge));
    return p}
  function cardBtn(it,inner){var b=el('button','card');b.type='button';b.setAttribute('aria-label','Buka '+it.title);b.appendChild(inner);b.onclick=function(){openSheet(it.id)};return b}

  /* hero */
  (function(){
    var it=BY[EVENT.hero],h=$('hero');h.style.setProperty('--h',it.h);
    h.appendChild(el('div','art',it.em));h.appendChild(el('div','shade'));
    var t=el('div','txt');
    var m=el('div','mark');m.innerHTML='<b>I</b> ACARA ';m.appendChild(document.createTextNode(EVENT.name.toUpperCase()+' · '+EVENT.date.toUpperCase()));t.appendChild(m);
    t.appendChild(el('h1',null,it.title));
    var tg=el('div','tags');it.tags.forEach(function(x){tg.appendChild(el('span',null,x))});t.appendChild(tg);
    var a=el('div','acts');
    var p=el('button','btn-play','▶ Buka');p.type='button';p.onclick=function(){openSheet(it.id)};
    var s=el('button','btn-sec','🗓 Agenda');s.type='button';s.onclick=function(){openSheet('agenda')};
    a.appendChild(p);a.appendChild(s);t.appendChild(a);h.appendChild(t);
  })();

  /* rows */
  var rowsEl=$('rows'),rowNodes=[];
  ROWS.forEach(function(r){
    var sec=el('section','row');sec.appendChild(el('h2',null,r.title));
    var rail=el('div','rail');
    r.ids.forEach(function(id,idx){
      var it=BY[id];
      if(r.style==='top10'){
        var w=el('div','t10');w.appendChild(el('span','n',String(idx+1)));w.appendChild(poster(it));
        rail.appendChild(cardBtn(it,w));
      }else if(r.style==='wide'){
        var w=el('div','wide');var th=el('div','thumb');th.style.setProperty('--h',it.h);
        th.appendChild(el('span','em',it.em));var pl=el('span','play');pl.appendChild(el('i',null,'▶'));th.appendChild(pl);w.appendChild(th);
        var bar=el('div','bar');var fill=el('i');fill.dataset.id=id;fill.style.width=done[id]?'100%':'6%';bar.appendChild(fill);w.appendChild(bar);
        var mt=el('div','meta');mt.appendChild(el('b',null,it.title));mt.appendChild(el('span',null,it.meta));w.appendChild(mt);
        rail.appendChild(cardBtn(it,w));
      }else{rail.appendChild(cardBtn(it,poster(it)))}
    });
    sec.appendChild(rail);rowsEl.appendChild(sec);rowNodes.push([r,sec]);
  });
  function refreshBars(){document.querySelectorAll('.bar i').forEach(function(f){f.style.width=done[f.dataset.id]?'100%':'6%'})}

  /* pills */
  var cat='all',pills=$('pills');
  PILLS.forEach(function(p){var b=el('button','pill',p[1]);b.type='button';b.setAttribute('aria-pressed',p[0]==='all');
    b.onclick=function(){cat=p[0];[].forEach.call(pills.children,function(c){c.setAttribute('aria-pressed',c===b)});
      rowNodes.forEach(function(n){n[1].hidden=!(cat==='all'||n[0].cat===cat)});
      $('hero').hidden=cat!=='all'};
    pills.appendChild(b)});

  /* blocks */
  function render(blk){
    var w=el('div','blk');
    if(blk.h)w.appendChild(el('h4',null,blk.h));
    if(blk.t==='p')w.appendChild(el('p',null,blk.text));
    else if(blk.t==='note')w.appendChild(el('div','note',blk.text));
    else if(blk.t==='list'){var u=el('ul','list');blk.items.forEach(function(x){u.appendChild(el('li',null,x))});w.appendChild(u)}
    else if(blk.t==='timeline'){var t=el('div','ep');blk.items.forEach(function(x){var d=el('div');d.appendChild(el('b',null,x[0]));d.appendChild(el('span',null,x[1]));t.appendChild(d)});w.appendChild(t)}
    else if(blk.t==='kv'){var l=el('dl','kv');blk.items.forEach(function(x){l.appendChild(el('dt',null,x[0]));l.appendChild(el('dd',null,x[1]))});w.appendChild(l)}
    else if(blk.t==='links'){blk.items.forEach(function(x){
      var ok=x[1]&&x[1]!=='#';var a=el('a','lnk'+(ok?'':' off'));if(ok){a.href=x[1];a.target='_blank';a.rel='noopener'}
      var s=el('span');s.appendChild(document.createTextNode(ok?x[0]:x[0]+' (link belum tersedia)'));if(x[2]&&ok)s.appendChild(el('small',null,x[2]));
      a.appendChild(s);a.appendChild(el('span',null,ok?'↗':'⏳'));w.appendChild(a)})}
    else if(blk.t==='swatches'){var s=el('div','sw');blk.items.forEach(function(x){var c=el('div');var i=el('i');i.style.background=x[1];c.appendChild(i);c.appendChild(el('span',null,x[0]));s.appendChild(c)});w.appendChild(s)}
    else if(blk.t==='secret'){var c=el('button','lock-card');c.type='button';c.appendChild(el('span','em','🔒'));c.appendChild(el('b',null,blk.title));c.appendChild(el('span',null,'Ketuk untuk intip'));
      c.onclick=function(){c.replaceChildren(el('span','em','🤫'),el('span',null,blk.reveal))};w.appendChild(c)}
    else if(blk.t==='groups'){
      var q=null,box=el('div','blk');
      if(blk.search){q=el('input','search');q.type='search';q.id='q'+Math.random().toString(36).slice(2,7);q.placeholder='Cari namamu...';q.setAttribute('aria-label','Cari nama');w.appendChild(q)}
      var draw=function(){box.replaceChildren();var term=q?q.value.trim().toLowerCase():'';var n=0;
        blk.items.forEach(function(g){if(term&&(g.name+' '+g.info).toLowerCase().indexOf(term)<0)return;n++;
          var c=el('div','grp');c.appendChild(el('b',null,g.name));var sp=el('span');var i=term?g.info.toLowerCase().indexOf(term):-1;
          if(i>=0){sp.appendChild(document.createTextNode(g.info.slice(0,i)));sp.appendChild(el('mark',null,g.info.slice(i,i+term.length)));sp.appendChild(document.createTextNode(g.info.slice(i+term.length)))}else sp.textContent=g.info;
          c.appendChild(sp);box.appendChild(c)});
        if(!n)box.appendChild(el('p','empty','Nama tidak ditemukan. Coba ejaan lain.'))};
      if(q)q.oninput=draw;draw();w.appendChild(box)}
    return w}

  /* sheet */
  var sheet=$('sheet'),back=$('backdrop'),lastFocus=null;
  function openSheet(id){
    var it=BY[id];if(!it)return;lastFocus=document.activeElement;
    $('sEm').textContent=it.em;$('sArt').style.setProperty('--h',it.h);
    var inn=$('sIn');inn.replaceChildren();
    inn.appendChild(el('h3',null,it.title)).id='sTitle';
    var ml=el('div','metaln');ml.appendChild(el('span','ok',it.task?'Wajib dikerjakan':'Wajib baca'));ml.appendChild(el('span',null,EVENT.date));ml.appendChild(el('span','age','SEMUA'));ml.appendChild(el('span',null,it.meta));inn.appendChild(ml);
    var acts=el('div','acts');var fl=firstLink(it);
    if(fl){var ok=fl[1]&&fl[1]!=='#';var p=el(ok?'a':'button','btn-play',ok?'▶ Buka link':'▶ Link belum tersedia');
      if(ok){p.href=fl[1];p.target='_blank';p.rel='noopener'}else{p.type='button';p.onclick=function(){toast('Link belum diisi panitia')}}acts.appendChild(p)}
    if(it.task){var d=el('button','btn-sec');d.type='button';
      var upd=function(){d.textContent=done[it.id]?'✓ Sudah selesai':'＋ Tandai selesai'};upd();
      d.onclick=function(){done[it.id]=!done[it.id];saveDone();upd();refreshBars();toast(done[it.id]?'Mantap, sudah ditandai':'Tanda dibatalkan')};acts.appendChild(d)}
    if(acts.children.length)inn.appendChild(acts);
    var tg=el('div','tags');it.tags.forEach(function(x){tg.appendChild(el('span',null,x))});inn.appendChild(tg);
    it.blocks.forEach(function(b){inn.appendChild(render(b))});
    var mo=ITEMS.filter(function(x){return x.id!==id}).slice(0,3);
    var mw=el('div','blk');mw.appendChild(el('h4',null,'Tontonan lainnya'));var g=el('div','more');
    mo.forEach(function(x){g.appendChild(cardBtn(x,poster(x)))});mw.appendChild(g);inn.appendChild(mw);
    $('sScroll').scrollTop=0;
    sheet.classList.add('on');back.classList.add('on');sheet.setAttribute('aria-hidden','false');document.body.classList.add('lock');$('sClose').focus();
  }
  function closeSheet(){sheet.classList.remove('on');back.classList.remove('on');sheet.setAttribute('aria-hidden','true');
    if(!$('srch').classList.contains('on'))document.body.classList.remove('lock');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
  $('sClose').onclick=closeSheet;back.onclick=closeSheet;
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(sheet.classList.contains('on'))closeSheet();else closeSearch()}});

  /* search */
  var srch=$('srch'),sin=$('srchIn'),res=$('srchRes');
  function drawSearch(){
    res.replaceChildren();var q=sin.value.trim().toLowerCase();var n=0;
    ITEMS.forEach(function(it){if(q&&JSON.stringify(it).toLowerCase().indexOf(q)<0)return;n++;res.appendChild(cardBtn(it,poster(it)))});
    if(!n)res.appendChild(el('p','empty','Tidak ada hasil untuk "'+sin.value+'".'))}
  function openSearch(){srch.classList.add('on');srch.setAttribute('aria-hidden','false');document.body.classList.add('lock');setNav('nSearch');drawSearch();sin.focus()}
  function closeSearch(){srch.classList.remove('on');srch.setAttribute('aria-hidden','true');document.body.classList.remove('lock');setNav('nHome')}
  sin.oninput=drawSearch;
  function setNav(id){['nHome','nSearch','nNews'].forEach(function(n){$(n).setAttribute('aria-current',n===id)})}
  $('nHome').onclick=function(){closeSearch();if(sheet.classList.contains('on'))closeSheet();window.scrollTo({top:0,behavior:'smooth'})};
  $('nSearch').onclick=function(){if(srch.classList.contains('on'))closeSearch();else{if(sheet.classList.contains('on'))closeSheet();openSearch()}};
  $('nNews').onclick=function(){closeSearch();openSheet('news')};
})();
</script>

</body></html>
